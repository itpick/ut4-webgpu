<!doctype html><html><head><meta charset=utf-8><title>UnrealTournament — WebGPU wasm boot (nixtop build)</title>
<style>
body{margin:0;background:#0b0e14;color:#9fe;font:12px/1.35 monospace}
#log{position:fixed;left:0;top:0;width:58%;height:100%;overflow:auto;white-space:pre-wrap;padding:10px;box-sizing:border-box;background:#000a;z-index:10}
#canvas{position:absolute;right:0;top:0;width:42%;height:100%;background:#000}
h3{color:#6df;margin:0 0 6px}
.g{color:#4f8}.r{color:#f66}.y{color:#fd6}.c{color:#6df}
</style></head>
<body>
<div id=log><h3>UnrealTournament → WebGPU wasm — booting the real game in your browser</h3></div>
<canvas id=canvas oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
<script>
const L=document.getElementById('log');
let n=0;
function line(s,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=String(s).slice(0,600);L.appendChild(d);if(++n%20===0)L.scrollTop=L.scrollHeight;}
line('crossOriginIsolated = '+self.crossOriginIsolated, self.crossOriginIsolated?'g':'r');
line('SharedArrayBuffer   = '+(typeof SharedArrayBuffer!=='undefined'), (typeof SharedArrayBuffer!=='undefined')?'g':'r');
line('navigator.gpu       = '+(!!navigator.gpu), navigator.gpu?'g':'r');
(async()=>{ if(navigator.gpu){ try{ const a=await navigator.gpu.requestAdapter();
  line('requestAdapter => '+(a?'OK':'null'), a?'g':'r');
  if(a){ const info=a.info||(a.requestAdapterInfo?await a.requestAdapterInfo():{}); line('GPU adapter: '+JSON.stringify(info).slice(0,200),'c'); const d=await a.requestDevice(); line('requestDevice => '+(d?'OK':'null'), d?'g':'r'); }
}catch(e){ line('WebGPU probe error: '+e,'r'); } } })();
line('=== loading UnrealTournament.wasm (673MB) — the browser must COMPILE it first, this takes a few minutes; watch for engine LogInit lines ===','y');
// stub SimplyStream platform-loader state so the standalone boot does not throw on project_id
window.parent = window;
window.state = window.parent.state = { ias:{}, project_id:"test", project_rev:"0", session_id:"00000000-0000-0000-0000-000000000000", platform_addr:"127.0.0.1:8091", asset_routing:{}, edge_boost_asset_host:"", vfs_asset_base_url:"" };
const _l=console.log,_e=console.error,_w=console.warn;
console.log=(...a)=>{line(a.join(' '));_l(...a);};
console.warn=(...a)=>{line(a.join(' '),'y');_w(...a);};
console.error=(...a)=>{line(a.join(' '),'r');_e(...a);};
var Module={
  canvas:document.getElementById('canvas'), arguments:[],
  print:(t)=>line(t), printErr:(t)=>line(t,'r'),
  locateFile:(p,pre)=>(pre||'')+p,
  onAbort:(w)=>line('*** ABORT: '+w+' ***','r'),
  onRuntimeInitialized:()=>line('*** onRuntimeInitialized — wasm instantiated, engine starting ***','g'),
};
window.onerror=(m)=>line('window.onerror: '+m,'r');
</script>
<script async src="UnrealTournament.js"></script>
</body></html>
